<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Africa | Review Information</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { 
            background: radial-gradient(circle at top, #041412, #000); 
            color: #ffffff; padding: 20px; display: flex; flex-direction: column; 
            align-items: center; min-height: 100vh; 
        }

        .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
        .page-title { font-size: 28px; font-weight: 900; text-transform: uppercase; color: #4fd1c5; }
        .sub-text { color: #9fcfc6; font-size: 14px; max-width: 280px; margin: 0 auto; line-height: 1.5; }

        .confirm-card {
            background: rgba(10, 40, 38, 0.75);
            backdrop-filter: blur(10px);
            width: 100%; max-width: 400px;
            padding: 30px; border-radius: 25px;
            border: 1px solid rgba(79, 209, 197, 0.2);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            margin-bottom: 25px;
        }

        .info-row { display: flex; justify-content: space-between; margin-bottom: 22px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .label { color: #9fcfc6; }
        .value { font-weight: 700; color: #fff; text-align: right; }
        .highlight { color: #4fd1c5 !important; }

        .total-box { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; }
        .total-text { font-size: 24px; font-weight: 900; color: #4fd1c5; }

        .btn-pay {
            width: 100%; background: linear-gradient(90deg, #4fd1c5, #2fb8a6); color: #000; border: none; padding: 20px;
            border-radius: 15px; font-weight: 900; font-size: 18px; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 5px 25px rgba(79, 209, 197, 0.3); margin-bottom: 15px;
            text-decoration: none; display: block; text-align: center;
        }
        .btn-edit { color: #444; text-decoration: underline; font-size: 14px; background: none; border: none; cursor: pointer; display: block; margin: 0 auto; }
        
        .toast {
            position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 360px; background: #080808; border: 1px solid #1a1a1a;
            border-radius: 20px; padding: 18px; display: flex; align-items: center; gap: 15px;
            transition: 0.5s; z-index: 1000;
        }
        .toast.active { bottom: 30px; }
        .icon-box { width: 45px; height: 45px; background: rgba(79,209,197,0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #4fd1c5; }
    </style>
</head>
<body>

    <div class="header">
        <h2 class="page-title">CONFIRM DETAILS</h2>
        <p class="sub-text">Almost there! Review your details before activating your Stream account.</p>
    </div>

    <div class="confirm-card">
        <div class="info-row"><span class="label">Name:</span><span class="value" id="res-name">...</span></div>
        <div class="info-row"><span class="label">Username:</span><span class="value" id="res-user">...</span></div>
        <div class="info-row"><span class="label">Email:</span><span class="value" id="res-email">...</span></div>
        <div class="info-row"><span class="label">Phone:</span><span class="value" id="res-phone">...</span></div>
        <div class="info-row" style="border:none;"><span class="label">Plan:</span><span class="value highlight">Stream Premium</span></div>

        <div class="total-box">
            <span class="total-text">Total Due:</span>
            <span class="total-text" id="res-total">₦12,000</span>
        </div>
    </div>

    <a href="payment_gateway.html" id="pay-link" class="btn-pay">PAY ₦12,000 NOW</a>
    <button class="btn-edit" onclick="history.back()">Back to Edit</button>

    <div id="pay-toast" class="toast">
        <div class="icon-box"><i class="fa-solid fa-circle-check"></i></div>
        <div>
            <div style="color:#4fd1c5; font-size: 11px; font-weight: 800; text-transform: uppercase;">ACTIVATE STREAM</div>
            <div id="toast-msg" style="font-size: 13px; margin: 3px 0; color: #fff;">...</div>
            <div style="color:#444; font-size: 10px;">Just now</div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        
        document.getElementById('res-name').innerText = urlParams.get('fullname') || 'User';
        document.getElementById('res-user').innerText = '@' + (urlParams.get('username') || 'user');
        document.getElementById('res-email').innerText = urlParams.get('email') || 'N/A';
        document.getElementById('res-phone').innerText = urlParams.get('phone') || 'N/A';

        // Fake Payment Toast Notifications
        function showPaymentToast() {
            const users = ["Chidi E.", "Amaka W.", "Blessing O.", "Tunde A.", "Musa Y.", "Sarah J."];
            const name = users[Math.floor(Math.random()*users.length)];
            
            document.getElementById('toast-msg').innerHTML = `<strong>${name}</strong> just activated <strong>Premium</strong>.`;
            const toast = document.getElementById('pay-toast');
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 5000);
        }
        setInterval(showPaymentToast, 15000);
        setTimeout(showPaymentToast, 3000);
    </script>
</body>
</html>
